<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Quick Exchange — USD Converter</title>
  <meta name="description" content="Convert US Dollars to JPY, THB, KRW, HKD and SGD at live exchange rates." />
  <meta name="theme-color" content="#0b1220" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Quick Exchange" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="hero">
      <h1>💱 Quick Exchange</h1>
      <p class="subtitle">Type an amount in US Dollars — see it in five Asian currencies.</p>
    </header>

    <section class="input-card">
      <label for="usd">Amount in USD</label>
      <div class="input-wrap">
        <span class="affix" aria-hidden="true">$</span>
        <input
          id="usd"
          type="number"
          inputmode="decimal"
          min="0"
          step="any"
          value="100"
          placeholder="0"
          autocomplete="off"
          autofocus
        />
        <span class="affix suffix" aria-hidden="true">USD</span>
      </div>
    </section>

    <p id="status" class="status" role="status">Loading live rates…</p>

    <section id="results" class="grid" aria-live="polite"></section>

    <footer class="footer">
      <div class="actions">
        <button id="refresh" type="button">↻ Refresh rates</button>
        <button id="install" class="primary" type="button" hidden>⤓ Install app</button>
      </div>
      <span id="updated" class="updated"></span>
    </footer>
    <p id="ios-hint" class="ios-hint" hidden>
      Tap <strong>Share</strong> <span aria-hidden="true">⎋</span> in Safari, then
      <strong>Add to Home Screen</strong> to install.
    </p>
  </main>

  <script src="app.js"></script>
</body>
</html>
