<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Quick Exchange — Quy đổi tiền tệ</title>
  <meta name="description" content="Quy đổi giữa Đô la Mỹ và Đồng Việt Nam, Yên Nhật, Baht Thái, Won Hàn Quốc, Đô la Hồng Kông, Đô la Singapore theo tỷ giá trực tiếp." />
  <meta name="theme-color" content="#f4f6fb" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Quick Exchange" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="hero">
      <h1>💱 Quick Exchange</h1>
      <p class="subtitle">Nhập số tiền bằng bất kỳ loại tiền nào — quy đổi ngay sang các loại tiền còn lại.</p>
    </header>

    <section class="input-card">
      <label for="amount">Số tiền</label>
      <div class="input-wrap">
        <span id="symbol" class="affix" aria-hidden="true">$</span>
        <input
          id="amount"
          type="number"
          inputmode="decimal"
          min="0"
          step="any"
          value="100"
          placeholder="0"
          autocomplete="off"
          autofocus
        />
        <select id="from" aria-label="Chọn loại tiền"></select>
      </div>
    </section>

    <p id="status" class="status" role="status">Đang tải tỷ giá…</p>

    <section id="results" class="grid" aria-live="polite"></section>

    <footer class="footer">
      <div class="actions">
        <button id="refresh" type="button">↻ Làm mới tỷ giá</button>
        <button id="install" class="primary" type="button" hidden>⤓ Cài đặt ứng dụng</button>
      </div>
      <span id="updated" class="updated"></span>
    </footer>
    <p id="ios-hint" class="ios-hint" hidden>
      Trong Safari, bấm <strong>Chia sẻ</strong> <span aria-hidden="true">⎋</span> rồi chọn
      <strong>Thêm vào Màn hình chính</strong> để cài đặt.
    </p>
  </main>

  <script src="app.js"></script>
</body>
</html>
